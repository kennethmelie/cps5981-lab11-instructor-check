# CPS 5981 Unit 11 - Drift check: does what is deployed still match what is declared?
# Declared state: iac/local/ (Terraform, local provider: renders the lab target's configuration).
# Deployed state: deployed/ (an export of the configuration that is actually running).
# Runs on a schedule, on demand, and whenever either side changes.
name: drift-check

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
  push:
    paths: ['iac/local/**', 'deployed/**']

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Render the DECLARED state from iac/local
        run: |
          terraform -chdir=iac/local init -input=false -no-color
          terraform -chdir=iac/local apply -auto-approve -input=false -no-color

      - name: Compare declared with DEPLOYED
        run: |
          set +e
          python3 scripts/drift_compare.py rendered deployed > drift-report.md
          code=$?
          cat drift-report.md | tee -a "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: Upload the drift report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: drift-report-${{ github.run_id }}
          path: |
            drift-report.md
            rendered/
          retention-days: 90
